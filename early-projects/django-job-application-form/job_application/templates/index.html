{% extends 'base.html' %}
{% block content %}

<h1 class="mt-4 mb-4">Job Application Form</h1>
<form method="post">
    {% csrf_token %}
    <div class="form-group mb-4">
        <label for="first_name">First Name:</label>
        <input class="form-control" type="text" id="first_name" name="first_name" required="">
    </div>
    <div class="form-group mb-4">
        <label for="middle_name">Middle Name:</label>
        <input class="form-control" type="text" id="middle_name" name="middle_name" required="">
    </div>
    <div class="form-group mb-4">
        <label for="last_name">Last Name:</label>
        <input class="form-control" type="text" id="last_name" name="last_name" required="">
    </div>
    <div class="form-group mb-4">
        <label for="email">Email:</label>
        <input class="form-control" type="email" id="email" name="email" required="">
    </div>
    <div class="form-group mb-4">
        <label for="phone">Phone:</label>
        <input class="form-control" type="text" id="phone" name="phone" required="">
    </div>
    <div class="mb-4">
        <label class="form-label d-block">Current Occupation *</label>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="occupation" id="employed" value="Employed" required>
            <label class="form-check-label" for="employed">Employed</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="occupation" id="unemployed" value="Unemployed" required>
            <label class="form-check-label" for="unemployed">Unemployed</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="occupation" id="self-employed" value="Self-Employed" required>
            <label class="form-check-label" for="self-employed">Self-Employed</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="occupation" id="student" value="Student" required>
            <label class="form-check-label" for="student">Student</label>
        </div>
    </div>
        <div class="mb-3">
            <button type="submit" class="btn btn-success">Submit Application</button>
        </div>

    {% if messages %}
    <div class="alert alert-success">
        {% for message in messages %}
            {{ message }}
        {% endfor %}
    </div>
    {% endif %}
</form>
{% endblock %}
