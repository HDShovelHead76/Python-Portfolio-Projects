<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Form</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-lg rounded-3">
      <div class="card-body p-5">
        <h1 class="mb-4 text-center">💼 Job Application</h1>

        <form action="/submit" method="post">

          <!-- Name -->
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <!-- Employment Status -->
          <div class="mb-3">
            <label class="form-label d-block">Employment Status</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="employment_status" id="employed" value="Employed" required>
              <label class="form-check-label" for="employed">Employed</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="employment_status" id="self_employed" value="Self-Employed">
              <label class="form-check-label" for="self_employed">Self-Employed</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="employment_status" id="student" value="Student">
              <label class="form-check-label" for="student">Student</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="employment_status" id="unemployed" value="Unemployed">
              <label class="form-check-label" for="unemployed">Unemployed</label>
            </div>
          </div>

          <!-- Education -->
          <div class="mb-3">
            <label for="education" class="form-label">Education</label>
            <textarea class="form-control" id="education" name="education" rows="3" required></textarea>
          </div>

          <!-- Experience -->
          <div class="mb-3">
            <label for="experience" class="form-label">Experience</label>
            <textarea class="form-control" id="experience" name="experience" rows="3" required></textarea>
          </div>

          <!-- Submit Button -->
          <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg">Submit Application</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (optional, for interactivity) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
