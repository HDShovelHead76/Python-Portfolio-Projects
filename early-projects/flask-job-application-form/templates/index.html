<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-5">
    <div class="container">
        <h2>Job Application Form 🚀</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger">
                {% for msg in messages %}
                    <div>{{ msg }}</div>
                {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('submit_application') }}" method="POST" enctype="multipart/form-data">
            <!-- Name Fields -->
            <div class="mb-3">
                <label>First Name *</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Middle Name</label>
                <input type="text" name="middle_name" class="form-control">
            </div>
            <div class="mb-3">
                <label>Last Name *</label>
                <input type="text" name="last_name" class="form-control" required>
            </div>

            <!-- Contact Fields -->
            <div class="mb-3">
                <label>Email *</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Phone *</label>
                <input type="text" name="phone" class="form-control" required>
            </div>

            <!-- Occupation -->
            <div class="mb-3">
                <label>Occupation *</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="occupation" value="Employed" required>
                    <label class="form-check-label">Employed</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="occupation" value="Self-Employed">
                    <label class="form-check-label">Self-Employed</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="occupation" value="Student">
                    <label class="form-check-label">Student</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="occupation" value="Unemployed">
                    <label class="form-check-label">Unemployed</label>
                </div>
            </div>

            <!-- Cover Letter -->
            <div class="mb-3">
                <label>Cover Letter</label>
                <textarea name="cover_letter" class="form-control" rows="4"></textarea>
            </div>

            <!-- Resume Upload -->
            <div class="mb-3">
                <label>Resume (PDF/DOC/DOCX) *</label>
                <input type="file" name="resume" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary">Submit Application</button>
        </form>
    </div>
</body>
</html>
