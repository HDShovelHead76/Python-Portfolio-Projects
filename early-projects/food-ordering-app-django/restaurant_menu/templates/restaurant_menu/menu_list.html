{% extends 'restaurant_menu/base.html' %}


{% block content %}
<h1 class="mt-4 mb-4">🍽️ Our Menu</h1>

<div class="row">
  {% for item in menu_items %}
  <div class="col-md-4 mb-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">{{ item.emoji }} {{ item.meal }}</h5>
<!--        <p class="card-text">{{ item.description }}</p>-->
        <p class="card-text"><strong>Price:</strong> ${{ item.price }}</p>
        <a href="{% url 'menu_item_details' slug=item.slug %}" class="btn btn-primary">View Details</a>
      </div>
      <div class="card-footer text-muted">
        Category: {{ item.category|title }} | Status: {{ item.get_status_display }}
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
