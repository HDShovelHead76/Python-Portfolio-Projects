<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Station {{ station }} - {{ year }}-{{ month }}</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  />
  <style>
    table.table thead th {
      text-align: center;
    }

    .table-responsive {
      overflow-x: auto;
      flex-grow: 1;
    }

    .pagination-container {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .pagination-dropdown {
      min-width: 150px;
    }
    }
    /* DATE column (assumed 2nd), auto-fit */
    table.table th:nth-child(1),
    table.table td:nth-child(1) {
      width: 0.5%;
      text-align: left;
    }
    }
    /* ✅ Right-align 'TG' column */
    table.table td:nth-child(2),
    table.table th:nth-child(2) {
      text-align: right;
    }

    /* Optional: control padding and font for tighter fit */
    table.table th,
    table.table td {
      padding: 0.4rem 0.6rem;
      font-size: 0.95rem;
      white-space: nowrap;
    }
  </style>
</head>
<body class="container mt-4">
  <h1 class="mb-4">
    Station {{ station }} - {{ station_name }} - {{ year }} / {{ month }}
  </h1>

  {% if data %}
  <div class="pagination-container">
    {% if total_pages > 1 %}
    <form method="get" class="pagination-dropdown">
      <input type="hidden" name="station" value="{{ station }}">
      <input type="hidden" name="year" value="{{ year }}">
      <input type="hidden" name="month" value="{{ month }}">
      <select name="page" class="form-select" onchange="this.form.submit()">
        {% for p in pages %}
        <option value="{{ p }}" {% if p == page %}selected{% endif %}>
          Page {{ p }}
        </option>
        {% endfor %}
      </select>
    </form>
    {% endif %}

    <div class="table-responsive">
      {{ data|safe }}
    </div>
  </div>
  {% else %}
  <p>No data available for station {{ station }} in {{ year }}/{{ month }}.</p>
  {% endif %}

  <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
</body>
</html>
