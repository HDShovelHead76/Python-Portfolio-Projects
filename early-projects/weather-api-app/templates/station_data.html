<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Station {{ station }} Data</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  />
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    /* Center the table header text */
    table.table thead th {
      text-align: center;
    }

    /* Ensure columns like DATE and TG auto-resize */
    table.table th, table.table td {
      white-space: nowrap;
      padding: 0.5rem 1.6rem;  /* Slightly smaller */
      font-size: 0.95rem;      /* Optional: shrink font */
    }

    /* DATE column (assumed 2nd), auto-fit */
    table.table th:nth-child(1),
    table.table td:nth-child(1) {
      width: 0.5%;
      text-align: left;
    }

    /* TG column (assumed 3rd), align right and auto-fit */
    table.table th:nth-child(2),
    table.table td:nth-child(2) {
      width: 0.5%;
      text-align: right;
    }

    .table-responsive {
      overflow-x: auto;
      flex-grow: 1;
      max-width: 100%;
    }

    .pagination-container {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .pagination-dropdown {
      min-width: 150px;
    }
  </style>
</head>
<body class="container mt-4">
  <h1 class="mb-4">Station {{ station }} Data</h1>

  {% if data %}
  <div class="pagination-container">
    {% if total_pages > 1 %}
    <form method="get" class="pagination-dropdown" style="margin-top: 0;">
      <input type="hidden" name="station" value="{{ station }}">
      <select name="page" class="form-select" onchange="this.form.submit()">
        {% for p in pages %}
          <option value="{{ p }}" {% if p == page %}selected{% endif %}>Page {{ p }}</option>
        {% endfor %}
      </select>
    </form>
    {% endif %}

    <div class="table-responsive">
      {{ data|safe }}
    </div>
  </div>
  {% else %}
    <p>No data available for station {{ station }}.</p>
  {% endif %}

  <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
</body>
</html>
