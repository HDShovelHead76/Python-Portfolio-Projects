<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Data API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="mb-4">Weather Data API</h1>

    <!-- Station All Data Form -->
    <form action="/api/v1/station-all" method="get" class="mb-4" target="_blank">
        <h5>Station (All Data)</h5>
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" name="station" class="form-control" placeholder="Station ID (e.g. 10)" required />
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary">Get All</button>
            </div>
        </div>
    </form>

    <!-- Station by Year and Month Form -->
    <form action="/api/v1/station-date" method="get" class="mb-4" target="_blank">
        <h5>Station by Year and Month</h5>
        <div class="row g-2">
            <div class="col-md-3">
                <input type="text" name="station" class="form-control" placeholder="Station ID (e.g. 10)" required>
            </div>
            <div class="col-md-3">
                <input type="number" name="year" class="form-control" placeholder="Year (e.g. 1988)" required>
            </div>
            <div class="col-md-3">
                <select name="month" class="form-control" required>
                    <option value="">Select Month</option>
                    {% for i in range(1, 13) %}
                        <option value="{{ '{:02d}'.format(i) }}">{{ '{:02d}'.format(i) }} - {{ ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i-1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary">Get Data</button>
            </div>
        </div>
    </form>

    <hr class="my-4">

    <!-- Available Stations -->
    <h4>Available Stations</h4>
    {% if stations %}
        <div class="table-responsive">
            {{ stations|safe }}
        </div>
    {% else %}
        <p>No station list available.</p>
    {% endif %}

    <!-- Station Data -->
    <h4 class="mt-4">Station Data</h4>
    {% if data %}
        <div class="table-responsive">
            {{ data|safe }}
        </div>
    {% else %}
        <p>No station data available.</p>
    {% endif %}
</body>
</html>
